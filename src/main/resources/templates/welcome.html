<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Welcome</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        /* TOP NAV */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #0d6efd;
            color: white;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .nav-buttons a {
            text-decoration: none;
            color: #0d6efd;
            background: white;
            padding: 8px 14px;
            margin-left: 10px;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.2s;
        }

        .nav-buttons a:hover {
            background: #e6e6e6;
        }

        /* CENTER CONTENT */
        .container {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 40px;
            color: #0d6efd;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #555;
            max-width: 500px;
        }

        .btn-main {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        .btn-main a {
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .login-btn {
            background: #0d6efd;
            color: white;
        }

        .signup-btn {
            background: white;
            border: 2px solid #0d6efd;
            color: #0d6efd;
        }

        .login-btn:hover {
            background: #0b5ed7;
        }

        .signup-btn:hover {
            background: #e9f0ff;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">🏥 Cabinet Médical</div>

    <div class="nav-buttons">
        <a th:href="@{/login}">Login</a>
        <a th:href="@{/signup}">Signup</a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="container">
    <h1>Bienvenue</h1>
    <p>
        Gestion complète d’un cabinet médical : patients, médecins,
        rendez-vous et ordonnances.
    </p>

    <div class="btn-main">
        <a th:href="@{/login}" class="login-btn">Login</a>
        <a th:href="@{/signup}" class="signup-btn">Sign Up</a>
    </div>
</div>

</body>
</html>
