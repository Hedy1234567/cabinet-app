<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
            transition: 0.3s;
        }
    </style>
</head>
    
<body>

<div th:fragment="sidebar">

<style>

.profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 0;
    text-align: center;
    margin-bottom: 5px;
}

/* avatar always perfectly centered */
.avatar {
    width: 42px;
    height: 42px;
    background: white;
    color: #0d6efd;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    margin-bottom: 6px;
    flex-shrink: 0;
}

/* username hidden in collapsed state */
.username {
    font-size: 12px;
    opacity: 0;
    transform: translateX(-8px);
    transition: 0.2s ease;
    white-space: nowrap;
}

/* show username when sidebar expands */
.sidebar:hover .username {
    opacity: 1;
    transform: translateX(0);
}

/* make sure hr doesn't push layout weirdly */
.sidebar hr {
    border-color: rgba(255,255,255,0.2);
    margin: 10px 0;
}

.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 70px;
    background: #0d6efd;
    overflow: hidden;
    transition: width 0.3s ease;
    padding-top: 15px;
    color: white;
    z-index: 9999;
}

.sidebar:hover {
    width: 230px;
}

/* BASE ITEM STYLE */
.sidebar-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    color: white;
    text-decoration: none;
    white-space: nowrap;
}

/* ICON always stable */
.icon {
    font-size: 18px;
    min-width: 25px;
    text-align: center;
}

/* TEXT hidden when collapsed */
.label {
    opacity: 0;
    transform: translateX(-10px);
    transition: 0.2s ease;
}

/* TEXT appears only when sidebar expands */
.sidebar:hover .label {
    opacity: 1;
    transform: translateX(0);
}

/* hover effect */
.sidebar-item:hover {
    background: rgba(255,255,255,0.15);
}

/* active */
.sidebar-item.active {
    background: rgba(255,255,255,0.25);
}

/* logout button fix */
.sidebar button.sidebar-item {
    width: 100%;
    border: none;
    background: transparent;
    cursor: pointer;
    text-align: left;
}
</style>

<div class="sidebar">

    <!-- PROFILE -->
    <div class="profile">
        <div class="avatar">
            <span th:text="${#authentication.name.substring(0,1).toUpperCase()}"></span>
        </div>
        <div class="username" th:text="${#authentication.name}"></div>
    </div>

    <hr>

    <span th:if="${activePage == 'home'}"
      class="sidebar-item active">
    <span class="icon">🏠</span>
    <span class="label">Home</span>
</span>

<a th:if="${activePage != 'home'}"
   href="/home"
   class="sidebar-item">
    <span class="icon">🏠</span>
    <span class="label">Home</span>
</a>


     <span th:if="${activePage == 'patients'}"
      class="sidebar-item active">
    <span class="icon">👤</span>
    <span class="label">Patients</span>
</span>

<a th:if="${activePage != 'patients'}"
   href="/patients"
   class="sidebar-item">
    <span class="icon">👤</span>
    <span class="label">Patients</span>
</a>


    <span th:if="${activePage == 'medecins'}"
      class="sidebar-item active">
    <span class="icon">👨‍⚕️</span>
    <span class="label">Médecins</span>
</span>

<a th:if="${activePage != 'medecins'}"
   href="/medecins"
   class="sidebar-item">
    <span class="icon">👨‍⚕️</span>
    <span class="label">Médecins</span>
</a>

    <form th:action="@{/logout}" method="post" style="margin:0;">
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}" />

    <button type="submit" class="sidebar-item">
        <span class="icon">🚪</span>
        <span class="label">Logout</span>
    </button>
</form>

</div>

</div>

</body>
</html>
