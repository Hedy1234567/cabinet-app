<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
            transition: 0.3s;
        }
    </style>
</head>
    
<body>

<div th:fragment="sidebar">

<style>

.profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px 0;
    text-align: center;
    margin-bottom: 5px;
}

/* avatar always perfectly centered */
.avatar {
    width: 42px;
    height: 42px;
    background: white;
    color: #0d6efd;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    margin-bottom: 6px;
    flex-shrink: 0;
}

/* username hidden in collapsed state */
.username {
    font-size: 12px;
    opacity: 0;
    transform: translateX(-8px);
    transition: 0.2s ease;
    white-space: nowrap;
}

/* show username when sidebar expands */
.sidebar:hover .username {
    opacity: 1;
    transform: translateX(0);
}

/* make sure hr doesn't push layout weirdly */
.sidebar hr {
    border-color: rgba(255,255,255,0.2);
    margin: 10px 0;
}

.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100vh;
    width: 70px;
    background: #0d6efd;
    overflow: hidden;
    transition: width 0.3s ease;
    padding-top: 15px;
    color: white;
    z-index: 9999;
}

.sidebar:hover {
    width: 230px;
}

/* BASE ITEM STYLE */
.sidebar-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    color: white;
    text-decoration: none;
    white-space: nowrap;
}

/* ICON always stable */
.icon {
    font-size: 18px;
    min-width: 25px;
    text-align: center;
}

/* TEXT hidden when collapsed */
.label {
    opacity: 0;
    transform: translateX(-10px);
    transition: 0.2s ease;
}

/* TEXT appears only when sidebar expands */
.sidebar:hover .label {
    opacity: 1;
    transform: translateX(0);
}

/* hover effect */
.sidebar-item:hover {
    background: rgba(255,255,255,0.15);
}

/* active */
.sidebar-item.active {
    background: rgba(255,255,255,0.25);
}

/* logout button fix */
.sidebar button.sidebar-item {
    width: 100%;
    border: none;
    background: transparent;
    cursor: pointer;
    text-align: left;
}
</style>

<body>

<div th:fragment="sidebar">

<div class="sidebar">

    <!-- PROFILE -->
    <div class="profile">
        <div class="avatar">
            <span th:text="${#authentication.name.substring(0,1).toUpperCase()}"></span>
        </div>
        <div class="username" th:text="${#authentication.name}"></div>
    </div>

    <hr>

    <!-- ===================== -->
    <!-- PATIENT -->
    <!-- ===================== -->
    <div th:if="${#authorization.expression('hasRole(''PATIENT'')')}">

        <a th:classappend="${activePage == 'patient-appointments'} ? ' active' : ''"
           href="/patient/patientdashboard"
           class="sidebar-item">
            <span class="icon">📅</span>
            <span class="label">Mes Rendez-vous</span>
        </a>

        <a th:classappend="${activePage == 'patient-book'} ? ' active' : ''"
           href="/patient/add"
           class="sidebar-item">
            <span class="icon">➕</span>
            <span class="label">Réserver</span>
        </a>

        <a th:classappend="${activePage == 'patient-calendar'} ? ' active' : ''"
           href="/appointments/calendar"
           class="sidebar-item">
            <span class="icon">🗓️</span>
            <span class="label">Calendrier</span>
        </a>

    </div>

    <!-- ===================== -->
    <!-- MEDECIN -->
    <!-- ===================== -->
    <div th:if="${#authorization.expression('hasRole(''MEDECIN'')')}">

        <a th:classappend="${activePage == 'patients'} ? ' active' : ''"
           href="/patients"
           class="sidebar-item">
            <span class="icon">👥</span>
            <span class="label">Patients</span>
        </a>

        <a th:classappend="${activePage == 'appointments'} ? ' active' : ''"
           href="/appointments"
           class="sidebar-item">
            <span class="icon">📅</span>
            <span class="label">Rendez-vous</span>
        </a>

    </div>

    <!-- ===================== -->
    <!-- ADMIN / SECRETAIRE -->
    <!-- ===================== -->
    <div th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''SECRETAIRE'')')}">

        <a th:classappend="${activePage == 'appointments'} ? ' active' : ''"
           href="/appointments"
           class="sidebar-item">
            <span class="icon">📋</span>
            <span class="label">Tous les RDV</span>
        </a>

        <a th:classappend="${activePage == 'add-appointment'} ? ' active' : ''"
           href="/appointments/add"
           class="sidebar-item">
            <span class="icon">➕</span>
            <span class="label">Ajouter RDV</span>
        </a>

        <a th:classappend="${activePage == 'patients'} ? ' active' : ''"
           href="/patients"
           class="sidebar-item">
            <span class="icon">👤</span>
            <span class="label">Patients</span>
        </a>

        <a th:classappend="${activePage == 'medecins'} ? ' active' : ''"
           href="/medecins"
           class="sidebar-item">
            <span class="icon">🩺</span>
            <span class="label">Médecins</span>
        </a>

    </div>

    <hr>


    <!-- LOGOUT -->
    <form th:action="@{/logout}" method="post" style="margin:0;">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <button type="submit" class="sidebar-item">
            <span class="icon">🚪</span>
            <span class="label">Logout</span>
        </button>
    </form>

</div>

</div>

</body>
</html>
