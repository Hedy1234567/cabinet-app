<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails Rendez-vous</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
            transition: 0.3s;
        }

        body {
            background: #f4f6f9;
        }

        .card {
            border: none;
            border-radius: 16px;
        }

        .header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            padding: 20px;
            border-radius: 16px 16px 0 0;
        }

        .section-title {
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #495057;
        }

        .info-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="content">

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-9">

            <div class="card shadow-lg">

                <!-- HEADER -->
                <div class="header">
                    <h3 class="mb-0">📅 Détails du Rendez-vous</h3>
                    <small>Informations complètes</small>
                </div>

                <div class="card-body p-4">

                    <!-- INFO -->
                    <div class="section-title">👤 Patient</div>
                    <div class="info-box">
                        <strong>Nom:</strong>
                        <span th:text="${appointment.patient.nom}"></span>
                    </div>

                    <div class="section-title">👨‍⚕️ Médecin</div>
                    <div class="info-box">
                        <strong>Nom:</strong>
                        <span th:text="${appointment.medecin.nom}"></span>
                    </div>

                    <div class="section-title">📆 Rendez-vous</div>

                    <div class="info-box">
                        <strong>Date:</strong>
                        <span th:text="${appointment.dateHeure}"></span>
                    </div>

                    <div class="info-box">
                        <strong>Durée:</strong>
                        <span th:text="${appointment.dureeMinutes}"></span> min
                    </div>

                    <div class="info-box">
                        <strong>Statut:</strong>
                        <span th:text="${appointment.statut}"></span>
                    </div>

                    <div class="info-box">
                        <strong>Motif:</strong>
                        <span th:text="${appointment.motif}"></span>
                    </div>

                    <!-- ACTION -->
                    <div class="mt-4">
                        <a href="/appointments" class="btn btn-outline-secondary">
                            ⬅ Retour
                        </a>
                    </div>

                </div>

            </div>

        </div>
    </div>

</div>

</div>

</body>
</html>
