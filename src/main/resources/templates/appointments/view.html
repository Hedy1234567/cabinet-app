<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Détails Rendez-vous</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
     /* BACKGROUND */
body {
    background: #f5f7fb;
    font-family: 'Segoe UI', sans-serif;
}

/* CONTENT */
.content {
    margin-left: 80px;
    padding: 30px;
}

/* CARD */
.card {
    border: none;
    border-radius: 20px;
    background: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    overflow: hidden;
}

/* HEADER */
.header {
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: white;
    padding: 25px;
}

/* TITLE SECTIONS */
.section-title {
    font-weight: 600;
    margin-top: 25px;
    margin-bottom: 12px;
    color: #374151;
    font-size: 15px;
}

/* INFO BOX */
.info-box {
    background: #f3f6fb;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    font-size: 14px;
    transition: 0.2s;
}

.info-box:hover {
    background: #eef2ff;
}

/* LABEL */
.info-box strong {
    color: #6b7280;
    font-weight: 500;
}

/* VALUE */
.info-box span {
    font-weight: 600;
    color: #111827;
}

/* BUTTON */
.btn-outline-secondary {
    border-radius: 12px;
    padding: 8px 18px;
    transition: 0.2s;
}

.btn-outline-secondary:hover {
    background: #e5e7eb;
}

/* SMALL TEXT */
small {
    opacity: 0.9;
}
    </style>
</head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="content">

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-9">

            <div class="card shadow-lg">

                <!-- HEADER -->
                <div class="header">
                    <h3 class="mb-0">📅 Détails du Rendez-vous</h3>
                    <small>Informations complètes</small>
                </div>

                <div class="card-body p-4">

                    <!-- INFO -->
                    <div class="section-title">👤 Patient</div>
                    <div class="info-box">
                        <strong>Nom:</strong>
                        <span th:text="${appointment.patient.nom}"></span>
                    </div>

                    <div class="section-title">👨‍⚕️ Médecin</div>
                    <div class="info-box">
                        <strong>Nom:</strong>
                        <span th:text="${appointment.medecin.nom}"></span>
                    </div>

                    <div class="section-title">📆 Rendez-vous</div>

                    <div class="info-box">
                        <strong>Date:</strong>
                        <span th:text="${appointment.dateHeure}"></span>
                    </div>

                    <div class="info-box">
                        <strong>Durée:</strong>
                        <span th:text="${appointment.dureeMinutes}"></span> min
                    </div>

                    <div class="info-box">
                        <strong>Statut:</strong>
                        <span th:text="${appointment.statut}"></span>
                    </div>

                    <div class="info-box">
                        <strong>Motif:</strong>
                        <span th:text="${appointment.motif}"></span>
                    </div>

                    <!-- ACTION -->
                    <div class="mt-4">

    <!-- PATIENT -->
    <a sec:authorize="hasRole('PATIENT')"
       th:href="@{/patient/patientdashboard}"
       class="btn btn-outline-secondary">
        ⬅ Retour
    </a>

    <!-- NOT PATIENT -->
    <a sec:authorize="!hasRole('PATIENT')"
       th:href="@{/appointments}"
       class="btn btn-outline-secondary">
        ⬅ Retour
    </a>

</div>

                </div>

            </div>

        </div>
    </div>

</div>

</div>

</body>
</html>
