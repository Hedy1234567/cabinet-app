<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Calendrier des Rendez-vous</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FULLCALENDAR -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
        }

        body {
            background: #f4f6f9;
        }

        #calendar {
            background: white;
            padding: 20px;
            border-radius: 15px;
        }
        
/* ===== GLOBAL BACKGROUND IMAGE ===== */
.global-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            rgba(30,64,175,0.85),
            rgba(37,99,235,0.65)
        ),
        url('https://images.unsplash.com/photo-1765222385545-71472fe6ee96?q=80&w=1920');

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    z-index: -1;
}

/* OPTIONAL: باش الكروت يبانوا clean */
.card,
.signup-card,
.login-card,
.container,
.topbar,
.content {
    position: relative;
    z-index: 1;
}

    </style>




</head>

<body>

<!-- BACKGROUND HERO -->
<div class="global-bg"></div>




<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="content">

    <div class="container py-4">

    <h2 class="mb-4">📅 Calendrier des Rendez-vous</h2>

    <!-- BACK BUTTON -->
    <div class="mb-3">

    <!-- PATIENT -->
    <a sec:authorize="hasRole('PATIENT')"
       th:href="@{/patient/dashboard}"
       class="btn btn-outline-primary btn-sm">
        ⬅ Dashboard
    </a>

    <!-- MEDECIN -->
    <a sec:authorize="hasRole('MEDECIN')"
       th:href="@{/medecin/dashboard}"
       class="btn btn-outline-primary btn-sm">
        ⬅ Dashboard
    </a>

    <!-- SECRETAIRE -->
    <a sec:authorize="hasRole('SECRETAIRE')"
       th:href="@{/secretaire/dashboard}"
       class="btn btn-outline-primary btn-sm">
        ⬅ Dashboard
    </a>

    <!-- ADMIN -->
    <a sec:authorize="hasRole('ADMIN')"
       th:href="@{/admin/dashboard}"
       class="btn btn-outline-primary btn-sm">
        ⬅ Dashboard
    </a>

</div>

    <div id="calendar"></div>

</div>

</div>

<script th:inline="javascript">

    document.addEventListener('DOMContentLoaded', function () {

        let calendarEl = document.getElementById('calendar');

        let calendar = new FullCalendar.Calendar(calendarEl, {

            initialView: 'dayGridMonth',

            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },

            events: /*[[${events}]]*/ []

        });

        calendar.render();
    });

</script>

</body>
</html>
