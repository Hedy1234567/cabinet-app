<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Ajouter Rendez-vous</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
   /* BACKGROUND */
body {
    background: #f5f7fb;
    font-family: 'Segoe UI', sans-serif;
}

/* CONTENT */
.content {
    margin-left: 80px;
    padding: 30px;
}

/* CARD (MAIN BOX) */
.card {
    border: none;
    border-radius: 18px;
    background: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    max-width: 700px;
    margin: auto;
}

/* TITLE */
h3 {
    font-weight: 700;
    margin-bottom: 5px;
}

/* LABEL */
label {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 6px;
    color: #374151;
}

/* INPUTS */
.form-control,
.form-select {
    border-radius: 12px;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #e5e7eb;
}

/* FOCUS EFFECT */
.form-control:focus,
.form-select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37,99,235,0.1);
}

/* BUTTON */
.btn-primary {
    background: #2563eb;
    border: none;
    border-radius: 12px;
    padding: 10px;
    font-weight: 600;
    width: 100%;
    margin-top: 10px;
}

.btn-primary:hover {
    background: #1e40af;
}

/* SPACING */
.mb-3 {
    margin-bottom: 18px !important;
}
    </style>
</head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="content">

    <div class="container py-4">

        <div class="card shadow-sm p-4">

            <h3 class="mb-4">➕ Nouveau Rendez-vous</h3>

            <form th:action="@{/appointments/add}" method="post">

                <!-- PATIENT -->
                <div class="mb-3">
                    <label>Patient</label>
                    <select name="patientId" class="form-select" required>
    <option value="">-- Choisir Patient --</option>
    <option th:each="p : ${patients}"
            th:value="${p.id}"
            th:text="${p.nom + ' ' + p.prenom}">
    </option>
</select>
                </div>

                <!-- MEDECIN -->
                <div class="mb-3">
                    <label>Médecin</label>
                    <select name="medecinId" class="form-select" required>
    <option value="">-- Choisir Médecin --</option>
    <option th:each="m : ${medecins}"
            th:value="${m.id}"
            th:text="${m.nom + ' ' + m.prenom}">
    </option>
</select>
                </div>

                <!-- DATE -->
                <div class="mb-3">
                    <label>Date & Heure</label>
                    <input type="datetime-local"
                           name="dateHeure"
                           class="form-control"
                           required>
                </div>

                <!-- DUREE -->
                <div class="mb-3">
                    <label>Durée (minutes)</label>
                    <input type="number"
                           name="dureeMinutes"
                           class="form-control"
                           required>
                </div>

                <!-- MOTIF -->
                <div class="mb-3">
                    <label>Motif</label>
                    <input type="text"
                           name="motif"
                           class="form-control">
                </div>

                <button class="btn btn-primary">
                    Enregistrer
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
