<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Ajouter Rendez-vous</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
        }

        body {
            background: #f4f6f9;
        }

        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="content">

    <div class="container py-4">

        <div class="card shadow-sm p-4">

            <h3 class="mb-4">➕ Nouveau Rendez-vous</h3>

            <form th:action="@{/appointments/add}" method="post">

                <!-- PATIENT -->
                <div class="mb-3">
                    <label>Patient</label>
                    <select name="patient" class="form-select" required>
                        <option value="">-- Choisir Patient --</option>
                        <option th:each="p : ${patients}"
                                th:value="${p.id}"
                                th:text="${p.nom + ' ' + p.prenom}">
                        </option>
                    </select>
                </div>

                <!-- MEDECIN -->
                <div class="mb-3">
                    <label>Médecin</label>
                    <select name="medecin" class="form-select" required>
                        <option value="">-- Choisir Médecin --</option>
                        <option th:each="m : ${medecins}"
                                th:value="${m.id}"
                                th:text="${m.nom + ' ' + m.prenom}">
                        </option>
                    </select>
                </div>

                <!-- DATE -->
                <div class="mb-3">
                    <label>Date & Heure</label>
                    <input type="datetime-local"
                           name="dateHeure"
                           class="form-control"
                           required>
                </div>

                <!-- DUREE -->
                <div class="mb-3">
                    <label>Durée (minutes)</label>
                    <input type="number"
                           name="dureeMinutes"
                           class="form-control"
                           required>
                </div>

                <!-- MOTIF -->
                <div class="mb-3">
                    <label>Motif</label>
                    <input type="text"
                           name="motif"
                           class="form-control">
                </div>

                <button class="btn btn-primary">
                    Enregistrer
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
