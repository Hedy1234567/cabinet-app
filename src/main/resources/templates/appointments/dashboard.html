<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Gestion des Rendez-vous</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
        }

        body {
            background: #f4f6f9;
        }

        .top-bar {
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        .table {
            border-radius: 12px;
            overflow: hidden;
        }

        .btn {
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="content">

    <div class="container py-4">

        <!-- HEADER -->
        <div class="top-bar d-flex justify-content-between align-items-center mb-4 shadow-sm">

            <div>
                <h2>📅 Gestion des Rendez-vous</h2>
                <small class="text-muted">Admin / Médecin / Secrétaire</small>
            </div>

                <a href="/appointments/calendar" class="btn btn-dark">
    📅 Voir calendrier
</a>


            <!-- ONLY SECRETARY + ADMIN CAN ADD -->
            <a sec:authorize="hasAnyRole('ADMIN','SECRETAIRE')"
               href="/appointments/add"
               class="btn btn-primary">
                + Nouveau rendez-vous
            </a>

        </div>

        <!-- TABLE -->
        <div class="card shadow-sm">

            <div class="card-body p-0">

                <table class="table table-hover mb-0">

                    <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>Patient</th>
                            <th>Médecin</th>
                            <th>Date</th>
                            <th>Durée</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="r : ${appointments}">

                            <td th:text="${r.id}"></td>

                            <td th:text="${r.patient.nom}"></td>

                            <td th:text="${r.medecin.nom}"></td>

                            <td th:text="${r.dateHeure}"></td>

                            <td th:text="${r.dureeMinutes}"></td>

                            <td th:text="${r.statut}"></td>

                            <td>

                                <!-- VIEW ALL ROLES -->
                                <a th:href="@{/appointments/{id}(id=${r.id})}"
                                   class="btn btn-info btn-sm">
                                    Voir
                                </a>

                                <!-- EDIT ONLY ADMIN + SECRETARY -->
                                <a sec:authorize="hasAnyRole('ADMIN','SECRETAIRE')"
                                   th:href="@{/appointments/edit/{id}(id=${r.id})}"
                                   class="btn btn-warning btn-sm">
                                    Modifier
                                </a>

                                <form th:action="@{/appointments/delete/{id}(id=${r.id})}"
      method="post"
      style="display:inline;">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}" />

    <button type="submit"
            class="btn btn-danger btn-sm"
            sec:authorize="hasRole('ADMIN')"
            onclick="return confirm('Supprimer ce rendez-vous ?')">

        Supprimer
    </button>

</form>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(appointments)}">
                            <td colspan="7" class="text-center text-muted p-4">
                                Aucun rendez-vous trouvé
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
