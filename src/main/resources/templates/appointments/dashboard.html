<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
<meta charset="UTF-8">
<title>Gestion des Rendez-vous</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* BACKGROUND */
body {
    background: #f5f7fb;
    font-family: 'Segoe UI', sans-serif;
}

/* CONTENT */
.content {
    margin-left: 80px;
    padding: 30px;
}

/* HEADER */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.page-title {
    font-size: 2.2rem;
    font-weight: 700;
}

/* CARD */
.rdv-card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* TOP */
.rdv-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* LEFT */
.rdv-left {
    display: flex;
    gap: 15px;
    align-items: center;
}

/* ICON */
.icon-box {
    width: 50px;
    height: 50px;
    background: #2563eb;
    color: white;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* STATUS */
.status {
    padding: 5px 12px;
    border-radius: 12px;
    font-size: 13px;
}

.status-CONFIRME { background:#e6f7ee; color:green; }
.status-ANNULE { background:#fde8e8; color:red; }
.status-TERMINE { background:#e8f0ff; color:#2563eb; }

/* INFO */
.rdv-info {
    display: flex;
    gap: 40px;
    margin-top: 10px;
    font-size: 14px;
}

/* MOTIF */
.rdv-motif {
    margin-top: 10px;
    background: #f3f6fb;
    padding: 10px;
    border-radius: 10px;
}

/* BUTTON */
.btn {
    border-radius: 10px;
}

/* DISABLED LINK */
.disabled-link {
    pointer-events: none;
    opacity: 0.6;
}

</style>
</head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="content">
<div class="container">

    <!-- HEADER -->
    <div class="top-bar">

        <div>
            <h1 class="page-title">Mes rendez-vous</h1>
            <p class="text-muted">Historique et rendez-vous à venir</p>
        </div>

        <!-- CALENDAR (DISABLED) -->
       <a href="/appointments/calendar"
                class="btn btn-dark">
                 📅 Voir calendrier
        </a>
    </div>

    <!-- LIST -->
    <div th:each="r : ${appointments}" class="rdv-card">

        <div class="rdv-top">

            <div class="rdv-left">

                <div class="icon-box">📅</div>

                <div>
                    <strong th:text="${r.medecin.specialite}">Médecine</strong><br>
                    <small>👨‍⚕️ <span th:text="${r.medecin.nom}"></span></small>
                </div>

            </div>

            <!-- STATUS -->
            <div class="status"
                 th:classappend="'status-' + ${r.statut}">
                <span th:text="${r.statut}"></span>
            </div>

        </div>

        <!-- INFO -->
        <div class="rdv-info">
            <div>📅 <span th:text="${#temporals.format(r.dateHeure,'yyyy-MM-dd')}"></span></div>
            <div>⏰ <span th:text="${#temporals.format(r.dateHeure,'HH:mm')}"></span></div>
        </div>

        <!-- MOTIF -->
        <div class="rdv-motif">
            Motif: <span th:text="${r.motif}"></span>
        </div>

        <!-- ACTIONS -->
        <div class="mt-3">

            <a th:href="@{/appointments/{id}(id=${r.id})}"
               class="btn btn-info btn-sm">
                Voir
            </a>

            <a sec:authorize="hasAnyRole('ADMIN','SECRETAIRE')"
               th:href="@{/appointments/edit/{id}(id=${r.id})}"
               class="btn btn-warning btn-sm">
                Modifier
            </a>

            <form th:action="@{/appointments/delete/{id}(id=${r.id})}"
                  method="post"
                  style="display:inline;">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <button type="submit"
                        class="btn btn-danger btn-sm"
                        sec:authorize="hasRole('ADMIN')"
                        onclick="return confirm('Supprimer ce rendez-vous ?')">

                    Supprimer
                </button>

            </form>

        </div>

    </div>

    <!-- EMPTY -->
    <div th:if="${#lists.isEmpty(appointments)}"
         class="text-center text-muted mt-4">
        Aucun rendez-vous trouvé
    </div>

</div>
</div>

</body>
</html>
