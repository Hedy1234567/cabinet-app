<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inscription - Cabinet Médical</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .signup-card {
            width: 480px;
            padding: 35px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .title {
            font-weight: 700;
            text-align: center;
            margin-bottom: 5px;
            font-size: 22px;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 12px;
            padding: 10px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .btn-primary {
            border-radius: 12px;
            padding: 10px;
            font-weight: 600;
        }

        .btn-outline-secondary {
            border-radius: 12px;
        }

        .upload-box {
            border: 2px dashed #dcdcdc;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: 0.3s;
        }

        .upload-box:hover {
            border-color: #0d6efd;
            background: #f8fbff;
        }
    </style>
</head>

<body>

<div class="signup-card">

    <div class="title">
        Créer un compte
    </div>

    <div class="subtitle">
        Rejoignez notre espace patient
    </div>

    <form th:action="@{/signup}" method="post" enctype="multipart/form-data">

        <!-- NAME -->
        <div class="mb-2">
            <label class="form-label">Nom</label>
            <input type="text" name="nom" class="form-control" required>
        </div>

        <!-- FAMILY NAME -->
        <div class="mb-2">
            <label class="form-label">Prénom</label>
            <input type="text" name="prenom" class="form-control" required>
        </div>

        <!-- EMAIL -->
        <div class="mb-2">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>

        <!-- DATE OF BIRTH -->
        <div class="mb-2">
            <label class="form-label">Date de naissance</label>
            <input type="date" name="dateNaissance" class="form-control" required>
        </div>

        <!-- LOCATION -->
        <div class="mb-2">
            <label class="form-label">Adresse</label>
            <input type="text" name="adresse" class="form-control" placeholder="Ville / Rue / Code postal">
        </div>

        <!-- CIN -->
        <div class="mb-2">
            <label class="form-label">CIN</label>
            <input type="text" name="cin" class="form-control" required>
        </div>

        <!-- PHONE -->
        <div class="mb-2">
            <label class="form-label">Téléphone</label>
            <input type="text" name="telephone" class="form-control">
        </div>

        <!-- IMAGE UPLOAD -->
        <div class="mb-3">
            <label class="form-label">Photo de profil (optionnel)</label>
            <div class="upload-box">
                <input type="file" name="image" class="form-control" style="border:none;">
            </div>
        </div>

        <hr>

        <!-- USERNAME -->
        <div class="mb-2">
            <label class="form-label">Nom d'utilisateur</label>
            <input type="text" name="username" class="form-control" required>
        </div>

        <!-- PASSWORD -->
        <div class="mb-2">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="mb-3">
            <label class="form-label">Confirmer mot de passe</label>
            <input type="password" name="confirmPassword" class="form-control" required>
        </div>

        <!-- BUTTON -->
        <button type="submit" class="btn btn-primary w-100">
            S'inscrire
        </button>

    </form>

    <!-- BACK -->
    <a href="/welcome" class="btn btn-outline-secondary w-100 mt-2">
        ⬅ Retour à l'accueil
    </a>

</div>

</body>
</html>
