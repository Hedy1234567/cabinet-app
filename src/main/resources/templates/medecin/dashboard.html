<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Dashboard Médecin</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* BACKGROUND */
body {
    background: #f5f7fb;
    font-family: 'Segoe UI', sans-serif;
}

/* TOPBAR */
.topbar {
    height: 70px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.05);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-icon {
    width: 40px;
    height: 40px;
    background: #2563eb;
    color: white;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.brand-text {
    font-weight: 700;
}

.brand-sub {
    font-size: 12px;
    color: gray;
}

.user-box {
    display: flex;
    align-items: center;
    gap: 20px;
}

/* CONTENT */
.content {
    margin-left: 80px;
    padding: 30px;
}

/* TITLE */
.dashboard-title {
    font-size: 2.3rem;
    font-weight: 700;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}

/* CARD */
.card-dashboard {
    background: white;
    border-radius: 18px;
    padding: 25px;
    transition: 0.3s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

.card-dashboard:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.08);
}

/* COLORS */
.card-main {
    background: #2563eb;
    color: white;
}

.card-green {
    background: #e6f7ee;
}

/* ICON */
.icon-box {
    font-size: 28px;
    margin-bottom: 10px;
}

/* BOXES */
.box {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

/* LIST ITEM */
.item {
    background: #eef4ff;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* LINK FIX */
a {
    text-decoration: none;
    color: inherit;
}
.logout-link {
    background: none;
    border: none;
    color: #dc3545;
    cursor: pointer;
    padding: 0;
    font: inherit;
}

.logout-link:hover {
    text-decoration: underline;
}

/* ===== GLOBAL BACKGROUND IMAGE ===== */
.global-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            rgba(30,64,175,0.85),
            rgba(37,99,235,0.65)
        ),
        url('https://images.unsplash.com/photo-1765222385545-71472fe6ee96?q=80&w=1920');

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    z-index: -1;
}

/* OPTIONAL: باش الكروت يبانوا clean */
.card,
.signup-card,
.login-card,
.container,
.topbar,
.content {
    position: relative;
    z-index: 1;
}

</style>
</head>

<body>
<!-- BACKGROUND HERO -->
<div class="global-bg"></div>

<div th:replace="fragments/navbar :: navbar"></div>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- CONTENT -->
<div class="content">
<div class="container">

    <!-- TITLE -->
    <div class="mb-4">
        <h1 class="dashboard-title">Tableau de bord</h1>
        <p class="text-muted">Gérez vos patients et consultations</p>
    </div>

    <!-- CARDS -->
    <div class="grid">

        <!-- PATIENTS -->
<a th:href="@{/patients}">
                <div class="card-dashboard card-main">
                <div class="icon-box">👥</div>
                <h5>Liste des patients</h5>
                <small>Voir tous les dossiers patients</small>
            </div>
        </a>

        <!-- RDV -->
        <a href="/appointments">
            <div class="card-dashboard">
                <div class="icon-box">📅</div>
                <h5>Rendez-vous</h5>
                <small>Voir tous les rendez-vous</small>
            </div>
        </a>

        <!-- TODAY -->
        <div class="card-dashboard card-green">
    <div class="icon-box">🟢</div>
    <h5>Aujourd'hui</h5>
    <small>Consultations du jour</small>

    <strong style="font-size:20px;"
            th:text="${todayCount}">
        0
    </strong>
</div>

    </div>

    <!-- LOWER SECTION -->
    <div class="row mt-4">

        <!-- RDV TODAY -->
        <div class="col-md-6">
    <div class="box">

        <h5>Rendez-vous du jour</h5>

        <div th:if="${#lists.isEmpty(todayRdvs)}">
            <small>Aucun rendez-vous aujourd’hui</small>
        </div>

        <div th:each="r : ${todayRdvs}" class="item">

            <div>
                <strong th:text="${r.patient.nom + ' ' + r.patient.prenom}">
                    Patient
                </strong><br>

                <small th:text="${r.motif}">
                    Motif
                </small>
            </div>

            <div>
                <span th:text="${#temporals.format(r.dateHeure,'HH:mm')}"></span>
            </div>

        </div>

    </div>
</div>

        <!-- RECENT PATIENTS -->
        <div class="col-md-6">
    <div class="box">

        <h5>Patients récents</h5>

        <div th:each="p : ${recentPatients}" class="item">

            <div>👤
                <span th:text="${p.nom + ' ' + p.prenom}"></span>
            </div>

            <div>
                <small th:text="${p.dateCreation}"></small>
            </div>

        </div>

    </div>
</div>

    </div>

</div>
</div>

</body>
</html>
