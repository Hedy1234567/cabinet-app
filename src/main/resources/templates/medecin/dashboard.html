<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cabinet Médical - Dashboard Médecin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
            transition: 0.3s;
        }

        body {
            background: linear-gradient(135deg, #f4f6f9, #e9eef5);
            min-height: 100vh;
        }

        .dashboard-title {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .card-dashboard {
            border: none;
            border-radius: 15px;
            transition: 0.3s;
            cursor: pointer;
        }

        .card-dashboard:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .icon-box {
            font-size: 40px;
        }
    </style>
</head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- MAIN CONTENT -->
<div class="content">
<div class="container py-5">

    <!-- WELCOME -->
    <div class="text-center mb-5">
        <h1 class="dashboard-title">Bienvenue Docteur 👨‍⚕️</h1>
        <p class="text-muted">Gestion des patients uniquement</p>
    </div>

    <!-- CARDS -->
    <div class="row g-4 justify-content-center">

        <!-- PATIENTS ONLY -->
        <div class="col-md-4">
            <a href="/patients" class="text-decoration-none text-dark">
                <div class="card card-dashboard text-center p-4">
                    <div class="icon-box">👤</div>
                    <h4 class="mt-3">Patients</h4>
                    <p class="text-muted">Consulter et gérer vos patients</p>
                </div>
            </a>
        </div>

    </div>

</div>
</div>

</body>
</html>
