<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier Patient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
            transition: 0.3s;
        }
    </style>



    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ffc107, #ffb300);
            color: #1f1f1f;
            padding: 20px;
        }

        .section-title {
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #495057;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn {
            border-radius: 10px;
        }
    </style>
</head>

<body>
<div class="content">
<div class="container py-5">


    <div class="row justify-content-center">
        <div class="col-lg-9">

            <div class="card shadow-lg">

                <!-- HEADER -->
                <div class="header">
                    <h3 class="mb-0">Modifier Patient</h3>
                    <small>Mise à jour des informations médicales</small>
                </div>

                <div class="card-body p-4">

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/patients/save}" th:object="${patient}" method="post">

                        <input type="hidden" th:field="*{id}">

                        <!-- IDENTITÉ -->
                        <div class="section-title">👤 Identité</div>
                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label">CIN</label>
                                <input type="text" th:field="*{cin}" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Nom</label>
                                <input type="text" th:field="*{nom}" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Prénom</label>
                                <input type="text" th:field="*{prenom}" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Date de naissance</label>
                                <input type="date" th:field="*{dateNaissance}" class="form-control">
                            </div>

                        </div>

                        <!-- CONTACT -->
                        <div class="section-title">📞 Contact</div>
                        <div class="row g-3">

                            <div class="col-md-6">
                                <label class="form-label">Téléphone</label>
                                <input type="text" th:field="*{telephone}" class="form-control">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" th:field="*{email}" class="form-control">
                            </div>

                        </div>

                        <!-- MÉDICAL -->
                        <div class="section-title">🩺 Informations médicales</div>

                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Antécédents</label>
                                <textarea th:field="*{antecedents}" class="form-control" rows="4"></textarea>
                            </div>
                        </div>

                        <!-- ACTIONS -->
                        <div class="d-flex justify-content-between mt-4">

                            <a href="/patients" class="btn btn-outline-secondary px-4">
                                Retour
                            </a>

                            <button type="submit" class="btn btn-warning px-4">
                                Mettre à jour
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>

</div>
</div>

</body>
</html>
