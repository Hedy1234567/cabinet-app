<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
            transition: 0.3s;
        }
    </style>

    
    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .card-header {
            border-radius: 15px 15px 0 0;
        }

        .form-control, .form-select {
            border-radius: 10px;
        }

        .btn {
            border-radius: 10px;
        }
    </style>
</head>

<body>
<div class="content">
<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-9">

            <div class="card shadow-lg">

                <!-- HEADER -->
                <div class="card-header bg-primary text-white p-4">
                    <h3 class="mb-0">👨‍⚕️ Gestion Médecin</h3>
                    <small>Ajouter ou modifier un médecin</small>
                </div>

                <div class="card-body p-4">

                    <h3 class="mb-4">➕ Nouveau Médecin</h3>

<form th:action="@{/medecins/add}" method="post">

    <!-- NOM -->
    <div class="mb-3">
        <label>Nom</label>
        <input type="text" name="nom" class="form-control" required>
    </div>

    <!-- PRENOM -->
    <div class="mb-3">
        <label>Prénom</label>
        <input type="text" name="prenom" class="form-control" required>
    </div>

    <!-- SPECIALITE -->
    <div class="mb-3">
        <label>Spécialité</label>
        <input type="text" name="specialite" class="form-control" required>
    </div>

    <!-- NUMERO ORDRE -->
    <div class="mb-3">
        <label>Numéro d'ordre</label>
        <input type="text" name="numeroOrdre" class="form-control" required>
    </div>

    <!-- TELEPHONE -->
    <div class="mb-3">
        <label>Téléphone</label>
        <input type="text" name="telephone" class="form-control">
    </div>

    <!-- EMAIL -->
    <div class="mb-3">
        <label>Email</label>
        <input type="email" name="email" class="form-control">
    </div>

    <!-- ACTIF -->
    <div class="mb-3">
        <label>Actif</label>
        <select name="actif" class="form-select">
            <option value="true">Actif</option>
            <option value="false">Inactif</option>
        </select>
    </div>

    <!-- SUBMIT -->
    <button class="btn btn-primary">
        Enregistrer
    </button>

</form>

                </div>
            </div>

        </div>
    </div>

</div>
</div>
</body>
</html>
