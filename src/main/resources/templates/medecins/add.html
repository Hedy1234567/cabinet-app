<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ajouter Médecin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5 fade-in">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="fragments/sidebar :: sidebar"></div>
        </div>

        <!-- Content -->
        <div class="col-md-9 col-lg-10">
            <div class="container">

                <div class="card shadow-sm">
                    <div class="card-body">

                        <h3 class="mb-4">Ajouter Médecin</h3>

                        <form th:action="@{/medecins/save}" method="post">

                            <div class="mb-3">
                                <label class="form-label">Nom</label>
                                <input type="text" name="nom" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Prénom</label>
                                <input type="text" name="prenom" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Spécialité</label>
                                <input type="text" name="specialite" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Numéro d'ordre</label>
                                <input type="text" name="numeroOrdre" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Téléphone</label>
                                <input type="text" name="telephone" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control">
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" name="actif" checked>
                                <label class="form-check-label">Actif</label>
                            </div>

                            <button class="btn btn-success">Save</button>
                            <a th:href="@{/medecins}" class="btn btn-secondary">Retour</a>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
