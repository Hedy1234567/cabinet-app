<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
            transition: 0.3s;
        }
    </style>

    
    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .card-header {
            border-radius: 15px 15px 0 0;
        }

        .form-control, .form-select {
            border-radius: 10px;
        }

        .btn {
            border-radius: 10px;
        }
    </style>
</head>

<body>
<div class="content">
<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-9">

            <div class="card shadow-lg">

                <!-- HEADER -->
                <div class="card-header bg-primary text-white p-4">
                    <h3 class="mb-0">👨‍⚕️ Gestion Médecin</h3>
                    <small>Ajouter ou modifier un médecin</small>
                </div>

                <div class="card-body p-4">

                    <form th:action="@{/medecins/save}" th:object="${medecin}" method="post">

                        <div class="row g-3">

                            <!-- NOM -->
                            <div class="col-md-6">
                                <label class="form-label">Nom</label>
                                <input type="text" th:field="*{nom}" class="form-control" placeholder="Nom">
                            </div>

                            <!-- PRENOM -->
                            <div class="col-md-6">
                                <label class="form-label">Prénom</label>
                                <input type="text" th:field="*{prenom}" class="form-control" placeholder="Prénom">
                            </div>

                            <!-- SPECIALITE -->
                            <div class="col-md-6">
                                <label class="form-label">Spécialité</label>
                                <input type="text" th:field="*{specialite}" class="form-control" placeholder="Cardiologue, Généraliste...">
                            </div>

                            <!-- NUMERO ORDRE -->
                            <div class="col-md-6">
                                <label class="form-label">Numéro d'ordre</label>
                                <input type="text" th:field="*{numeroOrdre}" class="form-control" placeholder="Ex: ORD12345">
                            </div>

                            <!-- EMAIL -->
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="email@example.com">
                            </div>

                            <!-- TELEPHONE -->
                            <div class="col-md-6">
                                <label class="form-label">Téléphone</label>
                                <input type="text" th:field="*{telephone}" class="form-control" placeholder="+216 ...">
                            </div>

                            <!-- ACTIF -->
                            <div class="col-md-6">
                                <label class="form-label">Statut</label>
                                <select th:field="*{actif}" class="form-select">
                                    <option value="true">Actif</option>
                                    <option value="false">Inactif</option>
                                </select>
                            </div>

                        </div>

                        <!-- BUTTONS -->
                        <div class="d-flex justify-content-between mt-4">

                            <a href="/medecins" class="btn btn-outline-secondary px-4">
                                Retour
                            </a>

                            <button type="submit" class="btn btn-success px-4">
                                Sauvegarder
                            </button>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>
</div>
</body>
</html>
