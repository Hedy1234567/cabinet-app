<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Liste des médecins</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* BACKGROUND */
body {
    background: #f5f7fb;
    font-family: 'Segoe UI', sans-serif;
}

/* CONTENT */
.content {
    margin-left: 80px;
    padding: 30px;
}

/* TITLE */
.page-title {
    font-size: 2.2rem;
    font-weight: 700;
}

/* SEARCH */
.search-box {
    background: white;
    border-radius: 18px;
    padding: 15px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    margin-bottom: 20px;
}

/* CARD */
.med-card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    transition: 0.3s;
}

.med-card:hover {
    transform: translateY(-4px);
}

/* TOP */
.med-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* LEFT */
.med-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

/* AVATAR */
.avatar {
    width: 60px;
    height: 60px;
    background: #e6edff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
}

/* NAME */
.med-name {
    font-weight: 600;
}

/* SPECIALITE */
.med-spec {
    color: #2563eb;
    font-size: 14px;
}

/* CONTACT */
.med-contact {
    margin-top: 10px;
    font-size: 14px;
    color: #555;
}

/* STATS */
.med-stats {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.stat-box {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    text-align: center;
}

.stat-blue {
    background: #eef2ff;
    color: #2563eb;
}

.stat-green {
    background: #e6f7ee;
    color: green;
}

/* BUTTON */
.btn {
    border-radius: 10px;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="content">
<div class="container">

    <!-- TITLE -->
    <div class="mb-4">
        <h1 class="page-title">Liste des médecins</h1>
        <p class="text-muted">Équipe médicale du cabinet</p>
    </div>

    <!-- SEARCH -->
    <div class="search-box">
        <input id="searchInput" class="form-control"
               placeholder="Rechercher un médecin...">
    </div>

    <!-- LIST -->
    <div class="row" id="medList">

        <div class="col-md-6" th:each="m : ${medecins}">

            <div class="med-card">

                <!-- TOP -->
                <div class="med-top">

                    <div class="med-left">

                        <div class="avatar">🩺</div>

                        <div>
                            <div class="med-name"
                                 th:text="'Dr. ' + ${m.nom} + ' ' + ${m.prenom}">
                            </div>

                            <div class="med-spec"
                                 th:text="${m.specialite}">
                            </div>
                        </div>

                    </div>

                </div>

                <!-- CONTACT -->
                <div class="med-contact">
                    <div>📧 <span th:text="${m.email}"></span></div>
                    <div>📞 <span th:text="${m.telephone}"></span></div>
                </div>

                <!-- STATS -->
                <div class="med-stats">
                    <div class="stat-box stat-blue">
                        <strong>-- ans</strong><br>
                        <small>Expérience</small>
                    </div>

                    <div class="stat-box stat-green">
                        <strong>--</strong><br>
                        <small>Patients</small>
                    </div>
                </div>

                <!-- ACTIONS -->
                <div class="mt-3">

                    <a th:href="@{/medecins/{id}(id=${m.id})}"
                       class="btn btn-info btn-sm">
                        Voir
                    </a>

                    <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                       th:href="@{/medecins/edit/{id}(id=${m.id})}"
                       class="btn btn-warning btn-sm">
                        Modifier
                    </a>

                    <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                       th:href="@{/medecins/delete/{id}(id=${m.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Supprimer ce médecin ?')">
                        Supprimer
                    </a>

                </div>

            </div>

        </div>

        <!-- EMPTY -->
        <div th:if="${#lists.isEmpty(medecins)}"
             class="text-center text-muted mt-4">
            Aucun médecin disponible
        </div>

    </div>

</div>
</div>

<script>
document.getElementById("searchInput").addEventListener("keyup", function () {

    let value = this.value.toLowerCase();
    let cards = document.querySelectorAll(".med-card");

    cards.forEach(card => {
        let text = card.innerText.toLowerCase();
        card.style.display = text.includes(value) ? "" : "none";
    });

});
</script>

</body>
</html>
