<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Médecins - Cabinet Médical</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
            transition: 0.3s;
        }
    </style>




    <style>
        body {
            background: #f4f6f9;
        }

        .top-bar {
            background: white;
            border-radius: 15px;
            padding: 20px;
        }

        .page-title {
            font-weight: 700;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .btn {
            border-radius: 10px;
        }

        .table thead {
            background: #0d6efd;
            color: white;
        }

        .table {
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>

<body>

<div th:replace="fragments/sidebar :: sidebar"></div>
<div class="content">
<div class="container py-4">

    <!-- HEADER -->
    <div class="top-bar d-flex justify-content-between align-items-center mb-4 shadow-sm">

        <div>
            <h2 class="page-title mb-0">👨‍⚕️ Gestion des Médecins</h2>
            <small class="text-muted">Liste des médecins du cabinet</small>
        </div>

        <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
   href="/medecins/add"
   class="btn btn-primary">
    + Ajouter un médecin
</a>

    </div>

    <!-- SEARCH -->
    <div class="card shadow-sm mb-4">
    <div class="card-body">

        <div class="row g-2">

            <div class="col-md-3">
                <input id="searchNom" class="form-control" placeholder="Nom">
            </div>

            <div class="col-md-3">
                <input id="searchPrenom" class="form-control" placeholder="Prénom">
            </div>

            <div class="col-md-3">
                <input id="searchSpec" class="form-control" placeholder="Spécialité">
            </div>

            <div class="col-md-3">
                <input id="searchNum" class="form-control" placeholder="Numéro ordre">
            </div>

        </div>

    </div>
</div>

    <!-- TABLE -->
    <div class="card shadow-sm">
        <div class="card-body p-0">

            <table class="table table-hover align-middle mb-0">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Spécialité</th>
                        <th>Numéro ordre</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th>Actif</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="m : ${medecins}">

                        <td th:text="${m.id}"></td>
                        <td th:text="${m.nom}"></td>
                        <td th:text="${m.prenom}"></td>
                        <td th:text="${m.specialite}"></td>
                        <td th:text="${m.numeroOrdre}"></td>
                        <td th:text="${m.email}"></td>
                        <td th:text="${m.telephone}"></td>

                        <td>
                            <span th:text="${m.actif} ? 'Oui' : 'Non'"
                                  th:classappend="${m.actif} ? 'text-success' : 'text-danger'">
                            </span>
                        </td>

                        <td>

                            <a th:href="@{/medecins/{id}(id=${m.id})}" class="btn btn-info btn-sm">
    Voir
</a>

<a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
   th:href="@{/medecins/edit/{id}(id=${m.id})}"
   class="btn btn-warning btn-sm">
    Modifier
</a>

<a th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
   th:href="@{/medecins/delete/{id}(id=${m.id})}"
   class="btn btn-danger btn-sm">
    Supprimer
</a>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(medecins)}">
                        <td colspan="9" class="text-center text-muted p-4">
                            Aucun médecin disponible
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>
    </div>

</div>
</div>

<script>
function filterTable() {

    let nom = document.getElementById("searchNom").value.toLowerCase();
    let prenom = document.getElementById("searchPrenom").value.toLowerCase();
    let spec = document.getElementById("searchSpec").value.toLowerCase();
    let num = document.getElementById("searchNum").value.toLowerCase();

    let rows = document.querySelectorAll("tbody tr");

    rows.forEach(row => {

        let cNom = row.cells[1].innerText.toLowerCase();
        let cPrenom = row.cells[2].innerText.toLowerCase();
        let cSpec = row.cells[3].innerText.toLowerCase();
        let cNum = row.cells[4].innerText.toLowerCase();

        let match =
            cNom.includes(nom) &&
            cPrenom.includes(prenom) &&
            cSpec.includes(spec) &&
            cNum.includes(num);

        row.style.display = match ? "" : "none";
    });
}

// attach events
["searchNom","searchPrenom","searchSpec","searchNum"].forEach(id => {
    document.getElementById(id).addEventListener("keyup", filterTable);
});
</script>

</body>
</html>
