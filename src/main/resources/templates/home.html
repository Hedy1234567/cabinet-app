<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accueil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="text-center home-content">
        <h1 class="fw-bold mb-3 display-5 text-dark">Bienvenue dans le cabinet médical</h1>
        <p class="mb-5 text-dark">Login success 🎉</p>

        <div class="row justify-content-center g-4">

            <div class="col-md-4">
                <div class="card p-4 shadow-lg">
                    <h5>Patients</h5>
                    <p class="text-muted">Gérer les patients</p>
                    <a th:href="@{/patients}" class="btn btn-primary">Accéder</a>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-4 shadow-lg">
                    <h5>Médecins</h5>
                    <p class="text-muted">Gérer les médecins</p>
                    <a th:href="@{/medecins}" class="btn btn-success">Accéder</a>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
