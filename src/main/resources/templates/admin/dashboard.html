<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Cabinet Médical - Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">



    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
            transition: 0.3s;
        }
    </style>

    <style>
        body {
            background: linear-gradient(135deg, #f4f6f9, #e9eef5);
            min-height: 100vh;
        }

        .navbar {
            background: #0d6efd;
        }

        .navbar-brand {
            font-weight: bold;
            color: white !important;
        }

        .dashboard-title {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .card-dashboard {
            border: none;
            border-radius: 15px;
            transition: 0.3s;
            cursor: pointer;
        }

        .card-dashboard:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .icon-box {
            font-size: 40px;
        }
    </style>
</head>

<body>
<div th:replace="fragments/sidebar :: sidebar"></div>


<!-- MAIN CONTENT -->
<div class="content">
<div class="container py-5">

    <!-- WELCOME -->
    <div class="text-center mb-5">
        <h1 class="dashboard-title">Bienvenue 👋</h1>
        <p class="text-muted">Système de gestion du cabinet médical</p>
    </div>

    <!-- CARDS -->
    <div class="row g-4 justify-content-center">

        <!-- PATIENTS -->
        <div class="col-md-4">
            <a href="/patients" class="text-decoration-none text-dark">
                <div class="card card-dashboard text-center p-4">
                    <div class="icon-box">👤</div>
                    <h4 class="mt-3">Patients</h4>
                    <p class="text-muted">Gestion des dossiers patients</p>
                </div>
            </a>
        </div>

        <!-- MEDECINS -->
        <div class="col-md-4">
            <a href="/medecins" class="text-decoration-none text-dark">
                <div class="card card-dashboard text-center p-4">
                    <div class="icon-box">👨‍⚕️</div>
                    <h4 class="mt-3">Médecins</h4>
                    <p class="text-muted">Gestion des médecins</p>
                </div>
            </a>
        </div>

        <!-- APPOINTMENTS CARD (ADMIN + MEDECIN + SECRETAIRE ONLY) -->
    <a href="/appointments" class="text-decoration-none text-dark">

        <div class="card card-dashboard text-center p-4">

            <div class="icon-box">📅</div>

            <h4 class="mt-3">Rendez-vous</h4>

            <p class="text-muted">
                Gestion des rendez-vous patients
            </p>

        </div>

    </a>



</div>
</div>
</body>
</html>
