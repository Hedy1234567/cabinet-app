<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body.login-bg {
            background: #f5f7fb;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-wrapper {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .back-container {
            position: absolute;
            top: 30px;
            width: 100%;
            text-align: center;
        }

        .back-link {
            text-decoration: none;
            color: #555;
            font-weight: 500;
        }

        .back-link:hover {
            color: #0d6efd;
        }

        .login-card {
            width: 360px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .login-icon {
            width: 55px;
            height: 55px;
            background: #2563eb;
            color: white;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 15px;
        }

        .input-pro {
            border-radius: 10px;
            height: 45px;
        }

        .input-pro:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13,110,253,0.1);
        }

        .btn-pro {
            height: 45px;
            border-radius: 10px;
            font-weight: 600;
        }

        @media (max-width: 500px) {
            .login-card {
                width: 90%;
            }
        }

        /* ===== GLOBAL BACKGROUND IMAGE ===== */
.global-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            rgba(30,64,175,0.85),
            rgba(37,99,235,0.65)
        ),
        url('https://images.unsplash.com/photo-1765222385545-71472fe6ee96?q=80&w=1920');

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    z-index: -1;
}

/* OPTIONAL: باش الكروت يبانوا clean */
.card,
.signup-card,
.login-card,
.container,
.topbar,
.content {
    position: relative;
    z-index: 1;
}

    </style>
</head>

<body class="login-bg">
<!-- BACKGROUND HERO -->
<div class="global-bg"></div>



<div class="login-wrapper">

    <div class="back-container">
        <a href="/" class="back-link">← Retour à l'accueil</a>
    </div>

    <div class="login-card">

        <div class="login-icon">+</div>

        <h3 class="text-center fw-bold">Connexion</h3>
        <p class="text-center text-muted mb-4">Accédez à votre espace patient</p>

        <form th:action="@{/login}" method="post">

            <div class="mb-3">
                <label class="form-label">Nom d'utilisateur</label>
                <input type="text" name="username"
                       class="form-control input-pro"
                       placeholder="Entrer username" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="password"
                       class="form-control input-pro"
                       placeholder="Entrer password" required>
            </div>

            <div class="d-flex justify-content-between mb-3">
                <small><input type="checkbox"> Se souvenir</small>
                <a href="#" class="small">Mot de passe oublié?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-pro">
                Se connecter
            </button>

        </form>

        <p class="text-center mt-3 small">
            Pas encore de compte?
            <a href="/signup">S’inscrire</a>
        </p>

    </div>

</div>

</body>
</html>
