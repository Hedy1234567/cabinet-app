<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Cabinet Médical</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">



    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
            transition: 0.3s;
        }
    </style>




    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #6ea8fe);
            height: 100vh;
        }

        .login-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
        }

        .login-header {
            background: #0d6efd;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-login {
            border-radius: 10px;
            background: #0d6efd;
            border: none;
        }

        .btn-login:hover {
            background: #0b5ed7;
        }

        .logo {
            font-size: 40px;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center h-100">

    <div class="card login-card shadow-lg" style="width: 380px;">

        <!-- HEADER -->
        <div class="login-header">
            <div class="logo">🏥</div>
            <h4 class="mb-0">Cabinet Médical</h4>
            <small>Connexion au système</small>
        </div>

        <!-- FORM -->
        <div class="card-body p-4">

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label class="form-label">Nom d'utilisateur</label>
                    <input type="text" name="username" class="form-control" placeholder="Entrer username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" name="password" class="form-control" placeholder="Entrer password" required>
                </div>

                <button type="submit" class="btn btn-login text-white w-100">
                    Se connecter
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
