<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="login-page d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card p-4 login-card shadow" style="width: 350px;">
    
    <h3 class="text-center mb-4 text-primary fw-bold">Connexion</h3>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <button class="btn btn-primary w-100">Se connecter</button>

    </form>

</div>

</body>
</html>
