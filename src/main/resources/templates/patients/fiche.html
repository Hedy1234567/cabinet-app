<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fiche Patient</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">





    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
            transition: 0.3s;
        }
    </style>




    <style>
        body {
            background: #f4f6f9;
        }

        .card {
            border: none;
            border-radius: 16px;
        }

        .header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            padding: 20px;
            border-radius: 16px 16px 0 0;
        }

        .section-title {
            font-weight: 600;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #495057;
        }

        .info-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
<div class="content">
<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-9">

            <div class="card shadow-lg">

                <!-- HEADER -->
                <div class="header">
                    <h3 class="mb-0">👤 Fiche Patient</h3>
                    <small>Détails complets du patient</small>
                </div>

                <div class="card-body p-4">

                    <!-- IDENTITÉ -->
                    <div class="section-title">👤 Identité</div>

                    <div class="row">

                        <div class="col-md-6">
                            <div class="info-box">
                                <strong>ID:</strong> <span th:text="${patient.id}"></span>
                            </div>
                            <div class="info-box">
                                <strong>CIN:</strong> <span th:text="${patient.cin}"></span>
                            </div>
                            <div class="info-box">
                                <strong>Nom:</strong> <span th:text="${patient.nom}"></span>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="info-box">
                                <strong>Prénom:</strong> <span th:text="${patient.prenom}"></span>
                            </div>
                            <div class="info-box">
                                <strong>Date de naissance:</strong> <span th:text="${patient.dateNaissance}"></span>
                            </div>
                        </div>

                    </div>

                    <!-- CONTACT -->
                    <div class="section-title">📞 Contact</div>

                    <div class="row">

                        <div class="col-md-6">
                            <div class="info-box">
                                <strong>Téléphone:</strong> <span th:text="${patient.telephone}"></span>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="info-box">
                                <strong>Email:</strong> <span th:text="${patient.email}"></span>
                            </div>
                        </div>

                    </div>

                    <!-- MÉDICAL -->
                    <div class="section-title">🩺 Informations médicales</div>

                    <div class="info-box">
                        <p th:text="${patient.antecedents}"></p>
                    </div>

                    <!-- ACTION -->
                    <div class="mt-4">
                        <a href="/patients" class="btn btn-outline-secondary">
                            ⬅ Retour
                        </a>
                    </div>

                </div>

            </div>

        </div>
    </div>

</div>
</div>
</body>
</html>
