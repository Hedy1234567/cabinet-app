<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Fiche Patient</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* BACKGROUND */
body {
    background: #f5f7fb;
    font-family: 'Segoe UI', sans-serif;
}

/* CONTENT */
.content {
    margin-left: 80px;
    padding: 30px;
}

/* CARD */
.main-card {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

/* TOP */
.top-section {
    display: flex;
    align-items: center;
    gap: 20px;
}

/* AVATAR */
.avatar {
    width: 70px;
    height: 70px;
    background: #e6edff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}

/* NAME */
.patient-name {
    font-size: 1.5rem;
    font-weight: 700;
}

/* INFO GRID */
.info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-top: 20px;
}

/* BOX */
.info-box {
    padding: 15px;
    border-radius: 14px;
    font-size: 14px;
}

/* COLORS */
.blue { background: #e8f0ff; }
.green { background: #e6f7ee; }
.purple { background: #f3e8ff; }
.red { background: #fde8e8; }

/* SECTION */
.section {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

/* ITEM */
.item {
    background: #eef4ff;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 10px;
}

/* LINK FIX */
a {
    text-decoration: none;
}

</style>
</head>

<body>

<div class="content">
<div class="container">

    <!-- TOP CARD -->
    <div class="main-card mb-4">

        <div class="top-section">

            <div class="avatar">👤</div>

            <div>
                <div class="patient-name"
                     th:text="${patient.nom + ' ' + patient.prenom}">
                </div>

                <small th:text="'Patient ID: #' + ${patient.id}"></small>
            </div>

        </div>

        <!-- INFO -->
        <div class="info-grid">

            <div class="info-box blue">
                📧 <strong>Email</strong><br>
                <span th:text="${patient.email}"></span>
            </div>

            <div class="info-box green">
                📞 <strong>Téléphone</strong><br>
                <span th:text="${patient.telephone}"></span>
            </div>

            <div class="info-box purple">
                📅 <strong>Date de naissance</strong><br>
                <span th:text="${patient.dateNaissance}"></span>
            </div>

            <div class="info-box red">
                🩸 <strong>CIN</strong><br>
                <span th:text="${patient.cin}"></span>
            </div>

        </div>

    </div>

    <!-- SECTIONS -->
    <div class="row">

        <!-- LEFT -->
        <div class="col-md-6">

            <div class="section">
                <h5>💊 Informations médicales</h5>

                <div class="item">
                    <p th:text="${patient.antecedents}"></p>
                </div>

            </div>

        </div>

        <!-- RIGHT -->
        <div class="col-md-6">

            <div class="section">
                <h5>📋 Informations supplémentaires</h5>

                <div class="item">
                    <strong>Nom:</strong>
                    <span th:text="${patient.nom}"></span>
                </div>

                <div class="item">
                    <strong>Prénom:</strong>
                    <span th:text="${patient.prenom}"></span>
                </div>

                <div class="item">
                    <strong>ID:</strong>
                    <span th:text="${patient.id}"></span>
                </div>

            </div>

        </div>

    </div>

    <!-- BACK -->
    <div class="mt-4">
        <a href="/patients" class="btn btn-outline-secondary">
            ⬅ Retour
        </a>
    </div>

</div>
</div>

</body>
</html>
