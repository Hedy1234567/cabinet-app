<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5 fade-in">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="fragments/sidebar :: sidebar"></div>
        </div>

        <!-- Content -->
        <div class="col-md-9 col-lg-10">
            <div class="container">

                <div class="card shadow-sm col-md-8 mx-auto">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">Ajouter un patient</h3>
                    </div>
                    <div class="card-body">
                        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                        <form th:action="@{/patients/save}" th:object="${patient}" method="post">

                            <div class="mb-3">
                                <label class="form-label">CIN</label>
                                <input type="text" th:field="*{cin}" class="form-control" placeholder="Entrer le CIN" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Nom</label>
                                <input type="text" th:field="*{nom}" class="form-control" placeholder="Entrer le nom" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Prénom</label>
                                <input type="text" th:field="*{prenom}" class="form-control" placeholder="Entrer le prénom" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Date de naissance</label>
                                <input type="date" th:field="*{dateNaissance}" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Téléphone</label>
                                <input type="text" th:field="*{telephone}" class="form-control" placeholder="Entrer le téléphone">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="Entrer l'email">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Antécédents</label>
                                <textarea th:field="*{antecedents}" class="form-control" rows="4" placeholder="Entrer les antécédents"></textarea>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/patients}" class="btn btn-secondary">Retour</a>
                                <button type="submit" class="btn btn-success">Ajouter</button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
