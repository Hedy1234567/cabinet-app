<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des patients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container-fluid mt-5">
    <div class="row">

        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="fragments/sidebar :: sidebar"></div>
        </div>

        <div class="col-md-9 col-lg-10">
            <div class="container">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="mb-0">Liste des patients</h1>
                    <a th:href="@{/patients/add}" class="btn btn-primary">+ Ajouter un patient</a>
                </div>

                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <form th:action="@{/patients}" method="get" class="row g-3">
                            <div class="col-md-10">
                                <input type="text" name="keyword" class="form-control"
                                       placeholder="Rechercher par nom, CIN ou téléphone"
                                       th:value="${keyword}">
                            </div>
                            <div class="col-md-2 d-grid">
                                <button type="submit" class="btn btn-outline-primary">Rechercher</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-body">
                        <table class="table table-bordered table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>CIN</th>
                                    <th>Nom</th>
                                    <th>Prénom</th>
                                    <th>Date de naissance</th>
                                    <th>Téléphone</th>
                                    <th>Email</th>
                                    <th style="width: 260px;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="patient : ${patients}">
                                    <td th:text="${patient.id}"></td>
                                    <td th:text="${patient.cin}"></td>
                                    <td th:text="${patient.nom}"></td>
                                    <td th:text="${patient.prenom}"></td>
                                    <td th:text="${patient.dateNaissance}"></td>
                                    <td th:text="${patient.telephone}"></td>
                                    <td th:text="${patient.email}"></td>
                                    <td>
                                        <a th:href="@{/patients/{id}(id=${patient.id})}" class="btn btn-info btn-sm me-2">
                                            Détails
                                        </a>

                                        <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn btn-warning btn-sm me-2">
                                            Modifier
                                        </a>

                                        <form th:action="@{/patients/delete/{id}(id=${patient.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-danger btn-sm">Supprimer</button>
                                        </form>
                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(patients)}">
                                    <td colspan="8" class="text-center text-muted">Aucun patient disponible</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
