<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Liste des patients</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

/* BACKGROUND */
body {
    background: #f5f7fb;
    font-family: 'Segoe UI', sans-serif;
}

/* CONTENT */
.content {
    margin-left: 80px;
    padding: 30px;
}

/* TITLE */
.page-title {
    font-size: 2.2rem;
    font-weight: 700;
}

/* SEARCH BOX */
.search-box {
    background: white;
    border-radius: 18px;
    padding: 15px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    margin-bottom: 20px;
}

/* CARD */
.patient-card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    transition: 0.3s;
}

.patient-card:hover {
    transform: translateY(-4px);
}

/* TOP */
.patient-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* LEFT */
.patient-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

/* AVATAR */
.avatar {
    width: 50px;
    height: 50px;
    background: #e6edff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* NAME */
.patient-name {
    font-weight: 600;
}

/* MAIN BUTTON */
.btn-view {
    background: #2563eb;
    color: white;
    border-radius: 12px;
    padding: 8px 15px;
}

/* BOTTOM */
.patient-bottom {
    margin-top: 15px;
    padding-top: 10px;
    border-top: 1px solid #eee;
    display: flex;
    gap: 30px;
    font-size: 14px;
    color: #555;
}

/* SMALL BUTTONS */
.btn {
    border-radius: 10px;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<div class="content">
<div class="container">

    <!-- TITLE -->
    <div class="mb-4">
        <h1 class="page-title">Liste des patients</h1>
        <!-- RETURN BUTTON (ROLE-BASED) -->
<div class="mb-3">

    <!-- ADMIN -->
    <a th:href="@{/admin/dashboard}"
       class="btn btn-outline-dark me-2"
       sec:authorize="hasRole('ADMIN')">
        ⬅ Retour dashboard admin
    </a>

    <!-- MEDECIN -->
    <a th:href="@{/medecin/dashboard}"
       class="btn btn-outline-primary me-2"
       sec:authorize="hasRole('MEDECIN')">
        ⬅ Retour dashboard médecin
    </a>

    <!-- SECRETAIRE -->
    <a th:href="@{/secretaire/dashboard}"
       class="btn btn-outline-success me-2"
       sec:authorize="hasRole('SECRETAIRE')">
        ⬅ Retour dashboard secrétaire
    </a>

    <!-- PATIENT (optional, in case reused page) -->
    <a th:href="@{/patient/dashboard}"
       class="btn btn-outline-secondary"
       sec:authorize="hasRole('PATIENT')">
        ⬅ Retour dashboard patient
    </a>

</div>
        <p class="text-muted">Gérer les dossiers patients</p>
    </div>

    <!-- SEARCH -->
    <div class="search-box">
        <input id="searchInput" class="form-control"
               placeholder="Rechercher un patient par nom ou email...">
    </div>

    <!-- LIST -->
    <div id="patientList">

        <!-- LOOP -->
        <div class="patient-card" th:each="patient : ${patients}">

            <div class="patient-top">

                <div class="patient-left">

                    <div class="avatar">👤</div>

                    <div>
                        <div class="patient-name"
                             th:text="${patient.nom + ' ' + patient.prenom}">
                        </div>

                        <small th:text="'CIN: ' + ${patient.cin}"></small>
                    </div>

                </div>

                <!-- BIG BUTTON -->
                <a th:href="@{/patients/{id}(id=${patient.id})}"
                   class="btn btn-view">
                    Voir le dossier
                </a>

            </div>

            <div class="patient-bottom">

                <div>📧 <span th:text="${patient.email}"></span></div>
                <div>📞 <span th:text="${patient.telephone}"></span></div>
                <div>📅 <span th:text="${patient.dateNaissance}"></span></div>

            </div>

            <!-- SMALL BUTTONS -->
<div class="mt-3">

    <!-- EDIT (ONLY ADMIN + SECRETAIRE) -->
    <a th:href="@{/patients/edit/{id}(id=${patient.id})}"
       class="btn btn-warning btn-sm"
       sec:authorize="hasAnyRole('ADMIN','SECRETAIRE')">
        Modifier
    </a>

    <!-- DELETE (ONLY ADMIN) -->
    <a th:href="@{/patients/delete/{id}(id=${patient.id})}"
       class="btn btn-danger btn-sm"
       sec:authorize="hasRole('ADMIN')"
       onclick="return confirm('Supprimer ce patient ?')">
        Supprimer
    </a>

</div>

        </div>

        <!-- EMPTY -->
        <div th:if="${#lists.isEmpty(patients)}"
             class="text-center text-muted mt-4">
            Aucun patient disponible
        </div>

    </div>

</div>
</div>

<script>
document.getElementById("searchInput").addEventListener("keyup", function () {

    let value = this.value.toLowerCase();
    let cards = document.querySelectorAll(".patient-card");

    cards.forEach(card => {
        let text = card.innerText.toLowerCase();
        card.style.display = text.includes(value) ? "" : "none";
    });

});
</script>

</body>
</html>
