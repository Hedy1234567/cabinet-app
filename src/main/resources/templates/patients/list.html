<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patients - Cabinet Médical</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">



    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
            transition: 0.3s;
        }
    </style>




    <style>
        body {
            background: #f4f6f9;
        }

        .top-bar {
            background: white;
            border-radius: 15px;
            padding: 20px;
        }

        .page-title {
            font-weight: 700;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .btn {
            border-radius: 10px;
        }

        .table thead {
            background: #0d6efd;
            color: white;
        }

        .table {
            overflow: hidden;
            border-radius: 12px;
        }

        .action-btns a {
            margin-right: 5px;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar"></div>
<div class="content">
<div class="container py-4">

    <!-- HEADER -->
    <div class="top-bar d-flex justify-content-between align-items-center mb-4 shadow-sm">

        <div>
            <h2 class="page-title mb-0">👤 Gestion des Patients</h2>
            <small class="text-muted">Liste complète des patients du cabinet</small>
        </div>

        <a href="/patients/add" class="btn btn-primary">
            + Ajouter un patient
        </a>

    </div>

    <!-- SEARCH -->
    <div class="card shadow-sm mb-4">
    <div class="card-body">

        <div class="row g-2">

            <div class="col-md-3">
                <input id="searchNom" class="form-control" placeholder="Nom">
            </div>

            <div class="col-md-3">
                <input id="searchPrenom" class="form-control" placeholder="Prénom">
            </div>

            <div class="col-md-3">
                <input id="searchCin" class="form-control" placeholder="CIN">
            </div>

            <div class="col-md-3">
                <input id="searchTel" class="form-control" placeholder="Téléphone">
            </div>

        </div>

    </div>
</div>

    <!-- TABLE -->
    <div class="card shadow-sm">
        <div class="card-body p-0">

            <table class="table table-hover mb-0 align-middle">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>CIN</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Date de naissance</th>
                        <th>Téléphone</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="patient : ${patients}">
                        <td th:text="${patient.id}"></td>
                        <td th:text="${patient.cin}"></td>
                        <td th:text="${patient.nom}"></td>
                        <td th:text="${patient.prenom}"></td>
                        <td th:text="${patient.dateNaissance}"></td>
                        <td th:text="${patient.telephone}"></td>
                        <td th:text="${patient.email}"></td>

                        <td class="action-btns">

                            <a th:href="@{/patients/{id}(id=${patient.id})}"
                               class="btn btn-info btn-sm">
                                Voir
                            </a>

                            <a th:href="@{/patients/edit/{id}(id=${patient.id})}"
                               class="btn btn-warning btn-sm">
                                Modifier
                            </a>

                            <a th:href="@{/patients/delete/{id}(id=${patient.id})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Supprimer ce patient ?')">
                                Supprimer
                            </a>

                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(patients)}">
                        <td colspan="8" class="text-center text-muted p-4">
                            Aucun patient disponible
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>
    </div>

</div>
</div>

<script>
function filterPatients() {

    let nom = document.getElementById("searchNom").value.toLowerCase();
    let prenom = document.getElementById("searchPrenom").value.toLowerCase();
    let cin = document.getElementById("searchCin").value.toLowerCase();
    let tel = document.getElementById("searchTel").value.toLowerCase();

    let rows = document.querySelectorAll("tbody tr");

    rows.forEach(row => {

        let cNom = row.cells[2].innerText.toLowerCase();
        let cPrenom = row.cells[3].innerText.toLowerCase();
        let cCin = row.cells[1].innerText.toLowerCase();
        let cTel = row.cells[5].innerText.toLowerCase();

        let match =
            cNom.includes(nom) &&
            cPrenom.includes(prenom) &&
            cCin.includes(cin) &&
            cTel.includes(tel);

        row.style.display = match ? "" : "none";
    });
}

// attach events
["searchNom","searchPrenom","searchCin","searchTel"].forEach(id => {
    document.getElementById(id).addEventListener("keyup", filterPatients);
});
</script>

</body>
</html>
