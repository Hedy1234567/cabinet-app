<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails du patient</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container-fluid mt-5">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 mb-4">
            <div th:replace="fragments/sidebar :: sidebar"></div>
        </div>

        <!-- Content -->
        <div class="col-md-9 col-lg-10">
            <div class="container">

                <div class="card shadow-sm col-md-8 mx-auto">
                    
                    <div class="card-header bg-info text-white">
                        <h3 class="mb-0">Fiche patient</h3>
                    </div>

                    <div class="card-body">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>CIN :</strong>
                                <span th:text="${patient.cin}"></span>
                            </div>

                            <div class="col-md-6">
                                <strong>Nom :</strong>
                                <span th:text="${patient.nom}"></span>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>Prénom :</strong>
                                <span th:text="${patient.prenom}"></span>
                            </div>

                            <div class="col-md-6">
                                <strong>Date de naissance :</strong>
                                <span th:text="${patient.dateNaissance}"></span>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <strong>Téléphone :</strong>
                                <span th:text="${patient.telephone}"></span>
                            </div>

                            <div class="col-md-6">
                                <strong>Email :</strong>
                                <span th:text="${patient.email}"></span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <strong>Antécédents :</strong>
                            <p class="border p-2 rounded bg-light" th:text="${patient.antecedents}"></p>
                        </div>

                        <div class="mb-3">
                            <strong>Date de création :</strong>
                            <span th:text="${patient.dateCreation}"></span>
                        </div>

                        <hr>

                        <!-- Partie future -->
                        <div class="mb-3">
                            <h5>Historique des rendez-vous</h5>
                            <p class="text-muted">À implémenter (Sprint 3)</p>
                        </div>

                        <div class="mb-3">
                            <h5>Ordonnances</h5>
                            <p class="text-muted">À implémenter (Sprint 3)</p>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/patients}" class="btn btn-secondary">Retour</a>

                            <div>
                                <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn btn-warning me-2">
                                    Modifier
                                </a>

                                <form th:action="@{/patients/delete/{id}(id=${patient.id})}" method="post" class="d-inline">
                                    <button class="btn btn-danger">Supprimer</button>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
