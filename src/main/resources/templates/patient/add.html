<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Ajouter Rendez-vous</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
      /* BACKGROUND */
body {
    background: #f5f7fb;
    font-family: 'Segoe UI', sans-serif;
}

/* CONTENT */
.content {
    margin-left: 80px;
    padding: 30px;
}

/* CARD */
.card {
    border: none;
    border-radius: 20px;
    padding: 30px;
    background: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    max-width: 650px;
    margin: auto;
}

/* TITLE */
h3 {
    font-weight: 700;
    margin-bottom: 5px;
}

h3 + p {
    color: #6b7280;
}

/* LABEL */
label {
    font-weight: 500;
    font-size: 14px;
    margin-bottom: 6px;
}

/* INPUT */
.form-control,
.form-select {
    border-radius: 12px;
    padding: 10px;
    font-size: 14px;
}

/* FOCUS */
.form-control:focus,
.form-select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(37,99,235,0.1);
}

/* BUTTON */
.btn-primary {
    background: #2563eb;
    border: none;
    border-radius: 12px;
    padding: 10px;
    font-weight: 600;
    width: 100%;
    margin-top: 10px;
}

.btn-primary:hover {
    background: #1e40af;
}

/* SPACING */
.mb-3 {
    margin-bottom: 18px !important;
}
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card p-4 shadow-sm">

        <h3 class="mb-4">📅 Book Appointment</h3>

        <form th:action="@{/patient/add}" method="post">

            <!-- ✅ PATIENT (HIDDEN, AUTO ASSIGNED) -->
            <input type="hidden" name="patient.id" th:value="${patientId}" />

            <!-- DOCTOR (OPTIONAL SIMPLE FIX OR STATIC) -->
            <div class="mb-3">
                <label>Doctor</label>
                <select name="medecin.id" class="form-select" required>
                    <option value="">-- Select Doctor --</option>
                    <option th:each="m : ${medecins}"
                            th:value="${m.id}"
                            th:text="${m.nom + ' ' + m.prenom}">
                    </option>
                </select>
            </div>
                    


            <!-- DATE -->
            <div class="mb-3">
                <label>Date & Time</label>
                <input type="datetime-local"
                       name="dateHeure"
                       class="form-control"
                       required>
            </div>

            <!-- DURATION -->
            <div class="mb-3">
                <label>Duration (minutes)</label>
                <input type="number"
                       name="dureeMinutes"
                       class="form-control"
                       required>
            </div>

            <!-- MOTIF -->
            <div class="mb-3">
                <label>Reason</label>
                <input type="text"
                       name="motif"
                       class="form-control">
            </div>

            <button type="submit" class="btn btn-primary">
    Enregistrer
</button>

        </form>

    </div>

</div>

</body>
</html>
