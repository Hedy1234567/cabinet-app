<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Ajouter Rendez-vous</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .content {
            margin-left: 80px;
            padding: 20px;
        }

        body {
            background: #f4f6f9;
        }

        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card p-4 shadow-sm">

        <h3 class="mb-4">📅 Book Appointment</h3>

        <form th:action="@{/patient/add}" method="post">

            <!-- ✅ PATIENT (HIDDEN, AUTO ASSIGNED) -->
            <input type="hidden" name="patient.id" th:value="${patientId}" />

            <!-- DOCTOR (OPTIONAL SIMPLE FIX OR STATIC) -->
            <div class="mb-3">
                <label>Doctor</label>
                <select name="medecin.id" class="form-select" required>
                    <option value="">-- Select Doctor --</option>
                    <option th:each="m : ${medecins}"
                            th:value="${m.id}"
                            th:text="${m.nom + ' ' + m.prenom}">
                    </option>
                </select>
            </div>
                    


            <!-- DATE -->
            <div class="mb-3">
                <label>Date & Time</label>
                <input type="datetime-local"
                       name="dateHeure"
                       class="form-control"
                       required>
            </div>

            <!-- DURATION -->
            <div class="mb-3">
                <label>Duration (minutes)</label>
                <input type="number"
                       name="dureeMinutes"
                       class="form-control"
                       required>
            </div>

            <!-- MOTIF -->
            <div class="mb-3">
                <label>Reason</label>
                <input type="text"
                       name="motif"
                       class="form-control">
            </div>

            <button type="submit" class="btn btn-primary">
    Enregistrer
</button>

        </form>

    </div>

</div>

</body>
</html>
