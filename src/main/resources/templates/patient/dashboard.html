<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f4f6f9, #e9eef5);
            min-height: 100vh;
        }

        .content {
            margin-left: 80px;
            padding: 20px;
            transition: 0.3s;
        }

        .dashboard-title {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .card-dashboard {
            border: none;
            border-radius: 15px;
            transition: 0.3s;
            cursor: pointer;
        }

        .card-dashboard:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .icon-box {
            font-size: 40px;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- MAIN CONTENT -->
<div class="content">

    <div class="container py-5">

        <!-- WELCOME -->
        <div class="text-center mb-5">
            <h1 class="dashboard-title">Bienvenue Patient 👋</h1>
            <p class="text-muted">Gérez vos rendez-vous facilement</p>
        </div>

        <!-- CARDS -->
        <div class="row g-4 justify-content-center">

            <!-- MY APPOINTMENTS -->
            <div class="col-md-4">
                <a href="/patient/patientdashboard" class="text-decoration-none text-dark">
                    <div class="card card-dashboard text-center p-4">
                        <div class="icon-box">📅</div>
                        <h4 class="mt-3">Mes Rendez-vous</h4>
                        <p class="text-muted">Voir vos consultations</p>
                    </div>
                </a>
            </div>

            <!-- BOOK APPOINTMENT -->
            <div class="col-md-4">
                <a href="/patient/add" class="text-decoration-none text-dark">
                    <div class="card card-dashboard text-center p-4">
                        <div class="icon-box">➕</div>
                        <h4 class="mt-3">Réserver</h4>
                        <p class="text-muted">Prendre un rendez-vous</p>
                    </div>
                </a>
            </div>

            <!-- CALENDAR -->
            <div class="col-md-4">
                <a href="/appointments/calendar" class="text-decoration-none text-dark">
                    <div class="card card-dashboard text-center p-4">
                        <div class="icon-box">🗓️</div>
                        <h4 class="mt-3">Calendrier</h4>
                        <p class="text-muted">Voir les créneaux disponibles</p>
                    </div>
                </a>
            </div>

        </div>

    </div>
</div>

</body>
</html>
